<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <main class="login">
        <a class="home-link" href="index.html">&larr; Home</a>
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="login-heading">Sign in to Study Hub</h1>
        <p class="intro">Continue learning and keep track of your progress.</p>

        <form action="#" method="post">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <label for="Forgot password"><a href="forgot-password.html">Forgot password?</a></label>

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
